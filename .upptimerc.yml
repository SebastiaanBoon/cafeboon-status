owner: SebastiaanBoon
repo: cafeboon-status

sites:
  - name: Enterprise Ego, website
    slug: company-brain-website
    url: https://enterpriseego.cafeboon.com/
  - name: Enterprise Ego, health check
    slug: company-brain-health
    url: https://enterpriseego.cafeboon.com/healthz
  - name: Enterprise Ego, MCP endpoint
    slug: company-brain-mcp
    url: https://enterpriseego.cafeboon.com/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
    body: "{}"
    expectedStatusCodes:
      - 401
  - name: Alter Ego, website
    slug: alter-ego-website
    url: https://cloudalterego.cafeboon.com/
  - name: Alter Ego, health check
    slug: alter-ego-health
    url: https://cloudalterego.cafeboon.com/healthz
  - name: Alter Ego, MCP endpoint
    slug: alter-ego-mcp
    url: https://cloudalterego.cafeboon.com/mcp
    method: POST
    headers:
      - "Content-Type: application/json"
    body: "{}"
    expectedStatusCodes:
      - 401

status-website:
  baseUrl: /cafeboon-status
  logoUrl: https://cloudalterego.cafeboon.com/assets/logo-192.png
  name: Cafe Boon status
  introTitle: "**Status of Enterprise Ego and Alter Ego**"
  introMessage: "These checks run every five minutes from GitHub. An incident is opened here when a product does not answer. The MCP endpoint check expects a 401 answer, because the endpoint answers unauthenticated calls with 401 when it is up. How incidents are handled is described in the incident policy of each product."
  navbar:
    - title: Status
      href: /
    - title: Enterprise Ego
      href: https://enterpriseego.cafeboon.com
    - title: Alter Ego
      href: https://cloudalterego.cafeboon.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
